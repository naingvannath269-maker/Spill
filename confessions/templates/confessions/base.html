{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anonymous Confession Wall</title>
    <script>
      try {
        if (localStorage.getItem("whisper-theme") === "dark") {
          document.documentElement.dataset.theme = "dark";
        }
      } catch {}
    </script>
    <!-- Bootstrap 5 CSS CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{% static 'confessions/CSS/wall.css' %}?v=3"
    />
    {% block page_css %}{% endblock %}
  </head>
  <body class="bg-light whisper-body">
    <!-- Responsive Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light whisper-nav">
      <div class="container">
        <a class="navbar-brand fw-bold whisper-brand" href="{% url 'wall' %}">
          <span class="whisper-brand-mark" aria-hidden="true">•••</span>
          Whisper
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto align-items-center">
            <li class="nav-item me-3">
              <button
                class="theme-toggle"
                id="theme-toggle"
                type="button"
                aria-label="Switch to dark mode"
                aria-pressed="false"
              >
                <span class="theme-toggle-icon" aria-hidden="true">☾</span>
                <span class="theme-toggle-label">Dark mode</span>
              </button>
            </li>
            {% if user.is_authenticated %}
            <li class="nav-item me-3">
              <span class="text-warning small"
                >Logged in as: <strong>@{{ user.username }}</strong></span
              >
            </li>
            <li class="nav-item">
              <form action="{% url 'logout' %}" method="post" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="theme-toggle">
                  Logout
                </button>
              </form>
            </li>
            {% else %}
            <li class="nav-item">
              <a class="nav-link" href="{% url 'login' %}">Login</a>
            </li>
            <li class="nav-item">
              <a
                class="theme-toggle"
                href="{% url 'signup' %}"
                >Sign Up</a
              >
            </li>
            {% endif %}
          </ul>
        </div>
      </div>
    </nav>

    <!-- Main Content Container -->
    <main class="container mb-5 whisper-main">
      {% block content %} {% endblock %}
    </main>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const themeToggle = document.getElementById("theme-toggle");
      if (themeToggle) {
        const themeLabel = themeToggle.querySelector(".theme-toggle-label");
        const themeIcon = themeToggle.querySelector(".theme-toggle-icon");

        const updateThemeToggle = () => {
          const isDark = document.documentElement.dataset.theme === "dark";
          themeLabel.textContent = isDark ? "Light mode" : "Dark mode";
          themeIcon.textContent = isDark ? "☀" : "☾";
          themeToggle.setAttribute("aria-label", `Switch to ${isDark ? "light" : "dark"} mode`);
          themeToggle.setAttribute("aria-pressed", String(isDark));
        };

        updateThemeToggle();
        themeToggle.addEventListener("click", () => {
          const nextTheme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
          document.documentElement.dataset.theme = nextTheme;
          try {
            localStorage.setItem("whisper-theme", nextTheme);
          } catch {}
          updateThemeToggle();
        });
      }
    </script>
  </body>
</html>
