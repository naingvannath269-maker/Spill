{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Spill — Let it out, leave your name out."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Spill" />
    <meta property="og:title" content="Spill" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="{% static 'confessions/images/favicon.svg' %}?v=2"
      sizes="any"
    />
    <meta
      property="og:description"
      content="Let it out, leave your name out."
    />
    <title data-i18n="document_title">
      Spill — Let it out, leave your name out.
    </title>
    <script>
      try {
        if (localStorage.getItem("whisper-theme") === "dark") {
          document.documentElement.dataset.theme = "dark";
        }
      } catch {}
    </script>
    <!-- Bootstrap 5 CSS CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'confessions/CSS/wall.css' %}?v=9" />
    <link
      rel="stylesheet"
      href="{% static 'confessions/CSS/comment.css' %}?v=2"
    />
    <link rel="stylesheet" href="{% static 'confessions/CSS/nav.css' %}?v=16" />
    <link
      rel="stylesheet"
      href="{% static 'confessions/CSS/pages.css' %}?v=5"
    />
    <link rel="stylesheet" href="{% static 'confessions/CSS/unlike.css' %}" />
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    {% block page_css %}{% endblock %}
  </head>
  <body class="bg-light whisper-body">
    {% include 'confessions/includes/nav.html' %}

    <!-- Main Content Container -->
    <main class="container mb-5 whisper-main">
      {% block content %} {% endblock %}
    </main>

    {% block floating_actions %}{% endblock %}

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'confessions/JS/language.js' %}?v=4"></script>
    <script src="{% static 'confessions/JS/base.js' %}?v=6"></script>
  </body>
</html>
