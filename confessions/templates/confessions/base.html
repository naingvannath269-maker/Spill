{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anonymous Confession Wall</title>
    <script>
      try {
        if (localStorage.getItem("whisper-theme") === "dark") {
          document.documentElement.dataset.theme = "dark";
        }
      } catch {}
    </script>
    <!-- Bootstrap 5 CSS CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{% static 'confessions/CSS/wall.css' %}?v=3"
    />
    <link rel="stylesheet" href="{% static 'confessions/CSS/nav.css' %}" />
    <link rel="stylesheet" href="{% static 'confessions/CSS/pages.css' %}" />
    <link rel="stylesheet" href="{% static 'confessions/CSS/unlike.css' %}" />
    {% block page_css %}{% endblock %}
  </head>
  <body class="bg-light whisper-body">
    {% include 'confessions/includes/nav.html' %}

    <!-- Main Content Container -->
    <main class="container mb-5 whisper-main">
      {% block content %} {% endblock %}
    </main>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const themeToggle = document.getElementById("theme-toggle");
      if (themeToggle) {
        const themeLabel = themeToggle.querySelector(".theme-toggle-label");
        const themeIcon = themeToggle.querySelector(".theme-toggle-icon");

        const updateThemeToggle = () => {
          const isDark = document.documentElement.dataset.theme === "dark";
          themeLabel.textContent = isDark ? "Light mode" : "Dark mode";
          themeIcon.textContent = isDark ? "☀" : "☾";
          themeToggle.setAttribute("aria-label", `Switch to ${isDark ? "light" : "dark"} mode`);
          themeToggle.setAttribute("aria-pressed", String(isDark));
        };

        updateThemeToggle();
        themeToggle.addEventListener("click", () => {
          const nextTheme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
          document.documentElement.dataset.theme = nextTheme;
          try {
            localStorage.setItem("whisper-theme", nextTheme);
          } catch {}
          updateThemeToggle();
        });
      }
    </script>
  </body>
</html>
