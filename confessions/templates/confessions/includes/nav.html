<nav class="site-nav" aria-label="Main navigation">
  <div class="site-nav__inner">
    <a class="site-nav__brand" href="{% url 'wall' %}">
      <span class="site-nav__brand-mark" aria-hidden="true">•••</span>
      Whisper
    </a>
    <ul class="site-nav__links" aria-label="Primary">
      <li>
        <a href="{% url 'wall' %}"{% if request.resolver_match.url_name == 'wall' %} aria-current="page"{% endif %}>Home</a>
      </li>
      <li>
        <a href="{% url 'confession' %}"{% if request.resolver_match.url_name == 'confession' %} aria-current="page"{% endif %}>Confession</a>
      </li>
      <li>
        <a href="{% url 'profile' %}"{% if request.resolver_match.url_name == 'profile' %} aria-current="page"{% endif %}>Profile</a>
      </li>
    </ul>
    <ul class="site-nav__actions" aria-label="Account">
      <li>
        <button
          class="theme-toggle"
          id="theme-toggle"
          type="button"
          aria-label="Switch to dark mode"
          aria-pressed="false"
        >
          <span class="theme-toggle-icon" aria-hidden="true">☾</span>
          <span class="theme-toggle-label">Dark mode</span>
        </button>
      </li>
      {% if user.is_authenticated %}
      <li>
        <form action="{% url 'logout' %}" method="post">
          {% csrf_token %}
          <button class="site-nav__action" type="submit">Logout</button>
        </form>
      </li>
      {% else %}
      <li>
        <a class="site-nav__action" href="{% url 'login' %}"{% if request.resolver_match.url_name == 'login' %} aria-current="page"{% endif %}>Login</a>
      </li>
      <li>
        <a class="site-nav__action" href="{% url 'signup' %}"{% if request.resolver_match.url_name == 'signup' %} aria-current="page"{% endif %}>Register</a>
      </li>
      {% endif %}
    </ul>
  </div>
</nav>
